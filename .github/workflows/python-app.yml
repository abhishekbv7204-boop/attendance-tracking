name: Python Backend Test

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      working-directory: backend
      run: |
        pip install -r requirements.txt

    - name: Run backend
      working-directory: backend
      run: |
        python app.py
